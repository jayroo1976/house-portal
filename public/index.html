<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<title>House Projects</title>
<style>
:root{--bg:#f6f7f8;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--acc:#0f766e;--acc2:#ccfbf1;--red:#b91c1c;--amber:#b45309;}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1a1f26;--ink:#e5e7eb;--muted:#9ca3af;--line:#2b323c;--acc:#2dd4bf;--acc2:#134e4a;--red:#f87171;--amber:#fbbf24;}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--acc);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:13px}
main{max-width:900px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:640px){.grid4{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat small{color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.04em}
.stat b{display:block;font-size:18px;margin-top:2px}
.neg{color:var(--red)}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:8px;display:flex}
.bar i{display:block;height:100%}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
select,input,textarea,button{font:inherit;color:inherit}
select,input,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.filters select{width:auto;flex:1;min-width:110px}
button.btn{background:var(--acc);color:#fff;border:0;border-radius:9px;padding:9px 14px;font-weight:600}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc);border-radius:9px;padding:8px 12px}
button.danger{background:transparent;color:var(--red);border:1px solid var(--red);border-radius:9px;padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}.row>.auto{flex:none}
.prio{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:16px 4px 6px;color:var(--muted)}
.item{display:flex;gap:10px;cursor:pointer}
.thumb{width:64px;height:64px;border-radius:9px;background:var(--acc2);flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--acc);font-size:22px}
.item h3{margin:0;font-size:15px}
.meta{color:var(--muted);font-size:12.5px}
.pill{display:inline-block;border-radius:99px;padding:1px 8px;font-size:11.5px;background:var(--acc2);color:var(--acc);margin-right:4px}
.pill.Essential{background:#fee2e2;color:#991b1b}.pill.Important{background:#ffedd5;color:#9a3412}
.money{margin-left:auto;text-align:right;font-size:13px;white-space:nowrap}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos figure{margin:0;position:relative}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
.photos figcaption{font-size:11.5px;color:var(--muted)}
.photos .x{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:50%;width:22px;height:22px;line-height:20px;padding:0}
h2{font-size:16px;margin:0 0 8px}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
.sp{height:8px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
td.r{text-align:right;white-space:nowrap}
.login{max-width:340px;margin:12vh auto;padding:0 14px}
.err{color:var(--red);font-size:13px;margin-top:6px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));box-shadow:0 4px 14px rgba(0,0,0,.25);border-radius:99px;padding:13px 20px}
.back{background:none;border:0;color:var(--acc);font-weight:600;padding:6px 0}
.comment{border-left:3px solid var(--acc2);padding:2px 8px;margin:8px 0}
.comment small{color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let cfg = null, state = { view: 'list', filters: {}, id: null };
const money = n => `${cfg.currency} ${Math.round(n || 0).toLocaleString('en-US')}`;

async function api(url, opts = {}) {
  if (opts.json) { opts.method = opts.method || 'POST'; opts.headers = { 'Content-Type': 'application/json' }; opts.body = JSON.stringify(opts.json); }
  const r = await fetch(url, opts);
  if (r.status === 401 && !url.includes('login')) { cfg.user = null; render(); throw new Error('auth'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

// downscale photos in the browser so phone pictures upload fast and PDFs stay small
async function shrink(file, max = 1600) {
  if (!file.type.startsWith('image/')) return file;
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
    return new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' });
  } catch { return file; }
}

async function boot() {
  cfg = await fetch('/api/config').then(r => r.json());
  document.title = cfg.title;
  if ('serviceWorker' in navigator) { /* no offline cache; keep data fresh */ }
  render();
}

function render() {
  const app = $('#app');
  if (!cfg.user) return app.innerHTML = loginHtml(), bindLogin();
  app.innerHTML = `<header>${state.view !== 'list' ? '' : ''}<h1>${esc(cfg.title)}</h1><button id="menu">${esc(cfg.user)}</button></header><main id="main"></main>`;
  $('#menu').onclick = menu;
  state.view === 'list' ? renderList() : renderItem();
}

function loginHtml() {
  return `<div class="login card"><h2>${esc(cfg.title)}</h2>
  <label>Name</label><input id="u" autocomplete="username" autocapitalize="none">
  <label>Password</label><input id="p" type="password" autocomplete="current-password">
  <div class="sp"></div><button class="btn" id="go" style="width:100%">Sign in</button><div class="err" id="e"></div></div>`;
}
function bindLogin() {
  const go = async () => {
    try { const r = await api('/api/login', { json: { user: $('#u').value, password: $('#p').value } }); cfg.user = r.user; render(); }
    catch (e) { $('#e').textContent = e.message; }
  };
  $('#go').onclick = go; $('#p').onkeydown = e => e.key === 'Enter' && go();
}

async function menu() {
  const b = await api('/api/backup').catch(() => ({}));
  const last = b.lastOk ? new Date(b.lastOk).toLocaleString() : 'never';
  const choice = prompt(`Signed in as ${cfg.user}\nLast backup: ${last}${b.lastError ? '\nNote: ' + b.lastError : ''}\n\nType:  1 = PDF (with photos)   2 = PDF (no photos)   3 = CSV   4 = Back up now   5 = Sign out`, '1');
  const q = new URLSearchParams(Object.fromEntries(Object.entries(state.filters).filter(([, v]) => v)));
  if (choice === '1') location.href = '/api/export.pdf?' + q;
  else if (choice === '2') location.href = '/api/export.pdf?photos=0&' + q;
  else if (choice === '3') location.href = '/api/export.csv?' + q;
  else if (choice === '4') { try { await api('/api/backup', { method: 'POST' }); alert('Backup complete'); } catch (e) { alert('Backup failed: ' + e.message); } }
  else if (choice === '5') { await api('/api/logout', { method: 'POST' }); cfg.user = null; render(); }
}

// ---------------- list ----------------
async function renderList() {
  const q = new URLSearchParams(Object.fromEntries(Object.entries(state.filters).filter(([, v]) => v)));
  const d = await api('/api/items?' + q).catch(() => null); if (!d) return;
  const s = d.summary, f = state.filters;
  const opt = (arr, cur, all) => `<option value="">${all}</option>` + arr.map(x => `<option ${x === cur ? 'selected' : ''}>${esc(x)}</option>`).join('');
  const pct = (v) => s.budget ? Math.min(100, v / s.budget * 100) : 0;
  let html = `<div class="grid4">
    <div class="stat"><small>Budget</small><b>${money(s.budget)}</b></div>
    <div class="stat"><small>Committed</small><b>${money(s.committed)}</b></div>
    <div class="stat"><small>Spent</small><b>${money(s.spent)}</b></div>
    <div class="stat"><small>Remaining</small><b class="${s.remaining < 0 ? 'neg' : ''}">${money(s.remaining)}</b></div></div>
    <div class="bar"><i style="width:${pct(s.spent)}%;background:var(--acc)"></i><i style="width:${Math.max(0, pct(s.committed) - pct(s.spent))}%;background:var(--amber);opacity:.6"></i></div>
    <div class="meta" style="margin-top:4px">${s.items} items | teal = spent, amber = committed to accepted quotes</div>
    <div class="filters">
      <select id="fp">${opt(cfg.priorities, f.priority, 'All priorities')}</select>
      <select id="fs">${opt(cfg.statuses, f.status, 'All statuses')}</select>
      <select id="fr">${opt(d.rooms, f.room, 'All rooms')}</select></div>`;
  cfg.priorities.forEach(p => {
    const g = d.items.filter(i => i.priority === p); if (!g.length) return;
    const b = s.byPriority[p];
    html += `<div class="prio">${esc(p)} - ${g.length} item${g.length > 1 ? 's' : ''} - budget ${money(b.budget)}</div>`;
    g.forEach(i => {
      const quote = i.accepted_quote != null ? `Quote ${money(i.accepted_quote)} (accepted)` : i.lowest_quote != null ? `Low quote ${money(i.lowest_quote)}` : '';
      html += `<div class="card item" data-id="${i.id}">
        ${i.cover ? `<img class="thumb" loading="lazy" src="/files/${i.cover}">` : `<div class="thumb">&#127968;</div>`}
        <div style="flex:1;min-width:0"><h3>${esc(i.title)}</h3>
          <div class="meta">${[i.room, i.category].filter(Boolean).map(esc).join(' - ')}</div>
          <div style="margin-top:3px"><span class="pill ${esc(i.priority)}">${esc(i.status)}</span>${i.file_count ? `<span class="meta">&#128247; ${i.file_count}</span>` : ''}</div></div>
        <div class="money"><b>${money(i.budget)}</b><div class="meta">${quote}</div>${i.spent ? `<div class="meta">spent ${money(i.spent)}</div>` : ''}</div></div>`;
    });
  });
  if (!d.items.length) html += `<div class="card meta">Nothing here yet. Tap "+ Add item" to start.</div>`;
  html += `<button class="btn fab" id="add">+ Add item</button><div style="height:70px"></div>`;
  $('#main').innerHTML = html;
  $('#fp').onchange = e => { state.filters.priority = e.target.value; renderList(); };
  $('#fs').onchange = e => { state.filters.status = e.target.value; renderList(); };
  $('#fr').onchange = e => { state.filters.room = e.target.value; renderList(); };
  document.querySelectorAll('.item').forEach(el => el.onclick = () => { state.view = 'item'; state.id = el.dataset.id; render(); });
  $('#add').onclick = addItem;
}

async function addItem() {
  const title = prompt('What needs doing / buying?'); if (!title) return;
  const priority = (prompt('Priority: 1 = Essential, 2 = Important, 3 = Nice to have', '3') || '3').trim();
  const r = await api('/api/items', { json: { title, priority: cfg.priorities[(+priority || 3) - 1] } });
  state.view = 'item'; state.id = r.id; render();
}

// ---------------- item detail ----------------
async function renderItem() {
  const d = await api('/api/items/' + state.id).catch(() => null); if (!d) return;
  const { item, quotes, spend, files, comments } = d;
  const opt = (arr, cur) => arr.map(x => `<option ${x === cur ? 'selected' : ''}>${esc(x)}</option>`).join('');
  const gallery = files.filter(f => f.kind === 'photo' || f.kind === 'idea');
  const docs = files.filter(f => f.kind === 'quote' || f.kind === 'receipt');
  const committed = Math.max(item.accepted_quote ?? 0, item.spent);
  $('#main').innerHTML = `
  <button class="back" id="back">&larr; All items</button>
  <div class="card"><label>Item</label><input id="title" value="${esc(item.title)}">
    <div class="row"><div><label>Room / area</label><input id="room" value="${esc(item.room)}" placeholder="Kitchen, garden..."></div>
    <div><label>Category</label><input id="category" value="${esc(item.category)}" placeholder="Plumbing, furniture..."></div></div>
    <div class="row"><div><label>Priority</label><select id="priority">${opt(cfg.priorities, item.priority)}</select></div>
    <div><label>Status</label><select id="status">${opt(cfg.statuses, item.status)}</select></div>
    <div><label>Budget (${cfg.currency})</label><input id="budget" type="number" inputmode="decimal" value="${item.budget || ''}"></div></div>
    <label>Notes</label><textarea id="notes" rows="3">${esc(item.notes)}</textarea>
    <div class="sp"></div><div class="row"><button class="btn" id="save">Save</button><button class="danger auto" id="del">Delete</button></div></div>

  <div class="card"><h2>Photos &amp; ideas</h2>
    ${gallery.length ? `<div class="photos">${gallery.map(f => `<figure><a href="/files/${f.filename}" target="_blank"><img loading="lazy" src="/files/${f.filename}"></a><button class="x" data-del-file="${f.id}">&times;</button>${f.caption ? `<figcaption>${esc(f.caption)}</figcaption>` : ''}</figure>`).join('')}</div>` : '<div class="meta">No photos yet.</div>'}
    <div class="sp"></div>
    <div class="row"><button class="ghost" id="cam">&#128247; Take photo</button><button class="ghost" id="pick">Choose from gallery</button></div>
    <input type="file" id="fcam" accept="image/*" capture="environment" hidden>
    <input type="file" id="fpick" accept="image/*" multiple hidden>
    <h2 style="margin-top:14px">Ideas &amp; comments</h2>
    ${comments.map(c => `<div class="comment"><small><b>${esc(c.created_by)}</b> - ${esc(c.created_at.slice(0, 10))} ${c.created_by === cfg.user ? `<a href="#" data-del-comment="${c.id}">delete</a>` : ''}</small><div>${esc(c.body).replace(/\n/g, '<br>')}</div></div>`).join('') || '<div class="meta">No comments yet.</div>'}
    <div class="row" style="margin-top:8px"><input id="cbody" placeholder="Add an idea, link or comment"><button class="btn auto" id="cadd">Post</button></div></div>

  <div class="card"><h2>Quotes <span class="meta">${item.lowest_quote != null ? 'lowest ' + money(item.lowest_quote) : ''}</span></h2>
    ${quotes.length ? `<table>${quotes.map(q => `<tr><td><b>${esc(q.vendor)}</b><div class="meta">${esc(q.quote_date || '')} ${esc(q.notes)}</div></td><td class="r">${money(q.amount)}<div><select data-qstatus="${q.id}" style="width:auto;padding:3px">${opt(['Received', 'Accepted', 'Rejected', 'Expired'], q.status)}</select></div></td><td class="r"><a href="#" data-del-quote="${q.id}">&times;</a></td></tr>`).join('')}</table>` : '<div class="meta">No quotes yet.</div>'}
    <div class="sp"></div>
    <div class="row"><input id="qv" placeholder="Vendor"><input id="qa" type="number" inputmode="decimal" placeholder="Amount"></div>
    <div class="row" style="margin-top:6px"><input id="qn" placeholder="Notes (scope, validity...)"><button class="btn auto" id="qadd">Add quote</button></div>
    ${docs.filter(f => f.kind === 'quote').map(f => `<div class="meta"><a href="/files/${f.filename}" target="_blank">&#128206; ${esc(f.original)}</a> <a href="#" data-del-file="${f.id}">&times;</a></div>`).join('')}
    <div style="margin-top:6px"><button class="ghost" id="qfile">Attach quote document</button><input type="file" id="fq" accept="image/*,application/pdf" hidden></div></div>

  <div class="card"><h2>Spend <span class="meta">${money(item.spent)} of ${money(item.budget)}${committed > item.budget && item.budget ? ' - <span class="neg">over budget</span>' : ''}</span></h2>
    ${spend.length ? `<table>${spend.map(s => `<tr><td>${esc(s.spend_date || '')}<div class="meta">${esc(s.vendor)} ${esc(s.notes)}</div></td><td class="r">${money(s.amount)}</td><td class="r"><a href="#" data-del-spend="${s.id}">&times;</a></td></tr>`).join('')}</table>` : '<div class="meta">Nothing spent yet.</div>'}
    <div class="sp"></div>
    <div class="row"><input id="sv" placeholder="Paid to"><input id="sa" type="number" inputmode="decimal" placeholder="Amount"></div>
    <div class="row" style="margin-top:6px"><input id="sn" placeholder="Note (deposit, final payment...)"><button class="btn auto" id="sadd">Add payment</button></div>
    ${docs.filter(f => f.kind === 'receipt').map(f => `<div class="meta"><a href="/files/${f.filename}" target="_blank">&#129534; ${esc(f.original)}</a> <a href="#" data-del-file="${f.id}">&times;</a></div>`).join('')}
    <div style="margin-top:6px"><button class="ghost" id="rfile">Attach receipt / invoice</button><input type="file" id="fr2" accept="image/*,application/pdf" hidden></div></div>`;

  const done = () => renderItem();
  const text = id => $(id).value;
  $('#back').onclick = () => { state.view = 'list'; render(); };
  $('#save').onclick = async () => { await api('/api/items/' + item.id, { method: 'PUT', json: { title: text('#title'), room: text('#room'), category: text('#category'), priority: text('#priority'), status: text('#status'), budget: text('#budget'), notes: text('#notes') } }); $('#save').textContent = 'Saved'; setTimeout(() => $('#save') && ($('#save').textContent = 'Save'), 1200); };
  $('#del').onclick = async () => { if (confirm('Delete this item and its photos, quotes and spend?')) { await api('/api/items/' + item.id, { method: 'DELETE' }); state.view = 'list'; render(); } };

  const upload = async (inp, kind) => {
    const fl = [...inp.files]; if (!fl.length) return;
    const fd = new FormData(); fd.append('kind', kind);
    for (const f of fl) fd.append('files', kind === 'photo' ? await shrink(f) : f);
    await api(`/api/items/${item.id}/files`, { method: 'POST', body: fd }); done();
  };
  $('#cam').onclick = () => $('#fcam').click(); $('#pick').onclick = () => $('#fpick').click();
  $('#fcam').onchange = e => upload(e.target, 'photo'); $('#fpick').onchange = e => upload(e.target, 'photo');
  $('#qfile').onclick = () => $('#fq').click(); $('#fq').onchange = e => upload(e.target, 'quote');
  $('#rfile').onclick = () => $('#fr2').click(); $('#fr2').onchange = e => upload(e.target, 'receipt');

  $('#cadd').onclick = async () => { if (text('#cbody').trim()) { await api(`/api/items/${item.id}/comments`, { json: { body: text('#cbody') } }); done(); } };
  $('#qadd').onclick = async () => { try { await api(`/api/items/${item.id}/quotes`, { json: { vendor: text('#qv'), amount: text('#qa'), notes: text('#qn') } }); done(); } catch (e) { alert(e.message); } };
  $('#sadd').onclick = async () => { try { await api(`/api/items/${item.id}/spend`, { json: { vendor: text('#sv'), amount: text('#sa'), notes: text('#sn') } }); done(); } catch (e) { alert(e.message); } };

  const del = (attr, url) => document.querySelectorAll(`[${attr}]`).forEach(el => el.onclick = async ev => { ev.preventDefault(); if (confirm('Delete?')) { await api(`${url}/${el.getAttribute(attr)}`, { method: 'DELETE' }); done(); } });
  del('data-del-file', '/api/files'); del('data-del-comment', '/api/comments'); del('data-del-quote', '/api/quotes'); del('data-del-spend', '/api/spend');
  document.querySelectorAll('[data-qstatus]').forEach(el => el.onchange = async () => { await api('/api/quotes/' + el.dataset.qstatus, { method: 'PUT', json: { status: el.value } }); done(); });
}
boot();
</script>
</body>
</html>
